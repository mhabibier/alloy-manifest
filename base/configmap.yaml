# ConfigMap for Grafana Alloy
# Config disesuaikan untuk Kubernetes:
# - Docker discovery diganti dengan Kubernetes pod discovery
# - loki.source.file membaca /var/log/pods/ dari node host
# - OTLP HTTP receiver (4318) untuk traces dari microservice (pakai OTLPTraceExporter proto-http)
# - OTLP gRPC receiver (4317) juga tetap aktif untuk kompatibilitas
# - Loki writer diarahkan ke Loki service DNS di namespace loki

apiVersion: v1
kind: ConfigMap
metadata:
  name: alloy-config
  namespace: alloy
  labels:
    app.kubernetes.io/name:      alloy
    app.kubernetes.io/component: config
data:
  config.alloy: |
    // Grafana Alloy — Kubernetes adaptation
    // Menerima OTLP traces dari semua microservice dan meneruskan ke Tempo.
    // Mengumpulkan logs dari semua pod Kubernetes dan meneruskan ke Loki.

    // ── OTLP Receiver — menerima traces dari semua microservice ─────────────────
    // Microservice menggunakan OTLPTraceExporter (proto-http) → url: endpoint/v1/traces
    // Ini berarti mereka kirim ke port 4318 (HTTP), BUKAN 4317 (gRPC)
    otelcol.receiver.otlp "default" {
      grpc {
        endpoint = "0.0.0.0:4317"
      }
      http {
        endpoint = "0.0.0.0:4318"
      }

      output {
        traces = [otelcol.exporter.otlp.tempo.input]
      }
    }

    // ── OTLP Exporter — forward traces ke Tempo ──────────────────────────────────
    otelcol.exporter.otlp "tempo" {
      client {
        endpoint = "tempo.tempo.svc.cluster.local:4317"
        tls {
          insecure = true
        }
      }
    }

    // ── Kubernetes Pod Discovery ─────────────────────────────────────────────────
    discovery.kubernetes "pods" {
      role = "pod"
    }

    // Relabel: filter dan map pod metadata ke Loki labels
    discovery.relabel "pod_logs" {
      targets = discovery.kubernetes.pods.targets

      // Hanya ambil pod yang running
      rule {
        source_labels = ["__meta_kubernetes_pod_phase"]
        regex         = "Pending|Succeeded|Failed"
        action        = "drop"
      }

      // Drop pod yang punya annotation logging: "false"
      rule {
        source_labels = ["__meta_kubernetes_pod_annotation_logging"]
        regex         = "false"
        action        = "drop"
      }

      // Namespace sebagai label
      rule {
        source_labels = ["__meta_kubernetes_namespace"]
        target_label  = "namespace"
      }

      // Nama pod
      rule {
        source_labels = ["__meta_kubernetes_pod_name"]
        target_label  = "pod"
      }

      // Nama container dalam pod
      rule {
        source_labels = ["__meta_kubernetes_pod_container_name"]
        target_label  = "container"
      }

      // Label app (dari pod labels: app=xxx)
      rule {
        source_labels = ["__meta_kubernetes_pod_label_app"]
        target_label  = "service_name"
      }

      // Label node untuk debugging
      rule {
        source_labels = ["__meta_kubernetes_pod_node_name"]
        target_label  = "node"
      }

      // Set path ke log file container di node
      // Format path K8s: /var/log/pods/<namespace>_<pod-name>_<uid>/<container>/<n>.log
      // Gunakan wildcard pada uid prefix untuk match direktori: *<uid>
      rule {
        source_labels = ["__meta_kubernetes_pod_uid", "__meta_kubernetes_pod_container_name"]
        separator     = "/"
        target_label  = "__path__"
        replacement   = "/var/log/pods/*$1/*.log"
      }
    }

    // ── Kubernetes Log Source ────────────────────────────────────────────────────
    // loki.source.file membaca log files dari node host via __path__ glob
    loki.source.file "pod_logs" {
      targets    = discovery.relabel.pod_logs.output
      forward_to = [loki.process.pod_logs.receiver]
    }

    // ── Log Processing ───────────────────────────────────────────────────────────
    loki.process "pod_logs" {
      // Coba parse sebagai JSON — jika gagal, tetap lolos sebagai plain text
      stage.json {
        expressions = {
          level       = "level",
          message     = "message",
          service     = "service",
          trace_id    = "trace_id",
          span_id     = "span_id",
          environment = "environment",
        }
      }

      // Set label level jika berhasil di-parse dari JSON
      stage.labels {
        values = {
          level       = "",
          service     = "",
          environment = "",
        }
      }

      // Hanya simpan label yang dibutuhkan (hindari high-cardinality)
      stage.label_keep {
        values = ["level", "service", "environment", "namespace", "pod", "container", "service_name"]
      }

      // Simpan trace_id & span_id sebagai structured metadata (hanya jika ada)
      stage.structured_metadata {
        values = {
          trace_id = "trace_id",
          span_id  = "span_id",
        }
      }

      forward_to = [loki.write.default.receiver]
    }

    // ── Loki Writer ──────────────────────────────────────────────────────────────
    loki.write "default" {
      endpoint {
        url = "http://loki.loki.svc.cluster.local:3100/loki/api/v1/push"
      }
    }

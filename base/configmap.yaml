# ConfigMap for Grafana Alloy
# Config disesuaikan untuk Kubernetes:
# - loki.source.kubernetes menggantikan loki.source.file
#   Membaca log langsung dari Kubernetes API (pods/log) — tidak butuh hostPath volume
#   Tidak ada risiko permission/glob pattern/path issue
# - OTLP HTTP receiver (4318) untuk traces dari microservice
# - OTLP gRPC receiver (4317) juga aktif untuk kompatibilitas
# - Loki writer diarahkan ke loki.loki.svc.cluster.local:3100

apiVersion: v1
kind: ConfigMap
metadata:
  name: alloy-config
  namespace: alloy
  labels:
    app.kubernetes.io/name:      alloy
    app.kubernetes.io/component: config
data:
  config.alloy: |
    // Grafana Alloy — Kubernetes
    // - Traces: OTLP HTTP/gRPC → Tempo
    // - Logs:   Kubernetes API (loki.source.kubernetes) → Loki

    // ── OTLP Receiver ────────────────────────────────────────────────────────────
    otelcol.receiver.otlp "default" {
      grpc {
        endpoint = "0.0.0.0:4317"
      }
      http {
        endpoint = "0.0.0.0:4318"
      }
      output {
        traces = [otelcol.exporter.otlp.tempo.input]
      }
    }

    // ── OTLP Exporter → Tempo ─────────────────────────────────────────────────
    otelcol.exporter.otlp "tempo" {
      client {
        endpoint = "tempo.tempo.svc.cluster.local:4317"
        tls {
          insecure = true
        }
      }
    }

    // ── Kubernetes Pod Discovery ─────────────────────────────────────────────────
    discovery.kubernetes "pods" {
      role = "pod"
    }

    // ── Relabel: filter dan map metadata ke Loki labels ──────────────────────────
    discovery.relabel "pod_logs" {
      targets = discovery.kubernetes.pods.targets

      // Drop pod yang tidak Running
      rule {
        source_labels = ["__meta_kubernetes_pod_phase"]
        regex         = "Pending|Succeeded|Failed|Unknown"
        action        = "drop"
      }

      // Drop pod tanpa container name (edge case)
      rule {
        source_labels = ["__meta_kubernetes_pod_container_name"]
        regex         = ""
        action        = "drop"
      }

      // Label: namespace
      rule {
        source_labels = ["__meta_kubernetes_namespace"]
        target_label  = "namespace"
      }

      // Label: pod name
      rule {
        source_labels = ["__meta_kubernetes_pod_name"]
        target_label  = "pod"
      }

      // Label: container name
      rule {
        source_labels = ["__meta_kubernetes_pod_container_name"]
        target_label  = "container"
      }

      // Label: service_name dari pod label app=xxx
      rule {
        source_labels = ["__meta_kubernetes_pod_label_app"]
        target_label  = "service_name"
      }

      // Label: node
      rule {
        source_labels = ["__meta_kubernetes_pod_node_name"]
        target_label  = "node"
      }
    }

    // ── Log Source via Kubernetes API ─────────────────────────────────────────────
    // loki.source.kubernetes membaca log dari Kubernetes API (pods/log endpoint)
    // Tidak butuh hostPath volume, tidak ada masalah permission/path
    loki.source.kubernetes "pod_logs" {
      targets    = discovery.relabel.pod_logs.output
      forward_to = [loki.process.pod_logs.receiver]
    }

    // ── Log Processing ───────────────────────────────────────────────────────────
    loki.process "pod_logs" {
      // Drop log entry yang lebih tua dari 24 jam
      // Mencegah error "timestamp too old" dari Loki (limit: 168h)
      // loki.source.kubernetes membaca dari awal pod saat pertama start;
      // stage.drop membuang log lama sebelum dikirim ke Loki
      stage.drop {
        older_than          = "24h"
        drop_counter_reason = "too_old"
      }

      // Coba parse sebagai JSON (Winston/structlog format)
      // Jika bukan JSON, log tetap lolos sebagai plain text
      stage.json {
        expressions = {
          level       = "level",
          message     = "message",
          service     = "service",
          trace_id    = "trace_id",
          span_id     = "span_id",
          environment = "environment",
        }
      }

      // Promote extracted fields ke Loki stream labels
      stage.labels {
        values = {
          level       = "",
          service     = "",
          environment = "",
        }
      }

      // Simpan hanya label yang dibutuhkan
      stage.label_keep {
        values = ["level", "service", "environment", "namespace", "pod", "container", "service_name"]
      }

      // trace_id & span_id sebagai structured metadata (kosong = skip)
      stage.structured_metadata {
        values = {
          trace_id = "trace_id",
          span_id  = "span_id",
        }
      }

      forward_to = [loki.write.default.receiver]
    }

    // ── Loki Writer ───────────────────────────────────────────────────────────────
    loki.write "default" {
      endpoint {
        url = "http://loki.loki.svc.cluster.local:3100/loki/api/v1/push"
      }
    }
